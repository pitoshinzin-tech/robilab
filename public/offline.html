<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C16">
<meta name="robots" content="noindex">
<title>電波が届いていません|ロビラボ</title>
<style>
:root { --bg: #0A0C16; --text: #EAF6FF; --muted: #9FB3C8; --accent: #39F3FF; --on-accent: #0A0C16; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
  line-height: 1.7;
}
main { display: grid; gap: 24px; justify-items: start; max-width: 28em; }
svg { display: block; }
h1 { margin: 0; font-size: 24px; font-weight: 700; }
p { margin: 0; font-size: 16px; color: var(--muted); }
a {
  display: inline-flex;
  align-items: center;
  min-height: 48px;
  padding: 0 24px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
}
a:active { transform: translateY(1px); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">
    <rect width="8" height="8" rx="1.5" fill="#0A0C16"/>
    <g fill="#FF4FD8">
      <rect x="2" y="1" width="4" height="1"/>
      <rect x="1" y="2" width="1" height="4"/>
      <rect x="6" y="2" width="1" height="4"/>
      <rect x="2" y="6" width="4" height="1"/>
    </g>
    <g fill="#A99BFF">
      <rect x="3" y="3" width="2" height="2"/>
    </g>
  </svg>
  <h1>電波が届いていません</h1>
  <p>つながったら、もう一度読み込んでください。</p>
  <a href="/">もう一度読み込む</a>
</main>
</body>
</html>
